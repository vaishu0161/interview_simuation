<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  video { width: 100%; max-width: 480px; border-radius: 8px; background: #000; }
  button {
    margin-top: 8px;
    margin-right: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { color: gray; margin-top: 6px; }
</style>
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>
  <br>
  <button id="startBtn">🔴 Start Recording</button>
  <button id="stopBtn" disabled>⏹ Stop &amp; Send</button>
  <p id="status">Click "Start Recording" to begin.</p>

<script>
  let mediaRecorder;
  let chunks = [];
  const preview = document.getElementById('preview');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  function sendValueToStreamlit(value) {
    window.parent.postMessage({
      type: "streamlit:setComponentValue",
      value: value,
      dataType: "json"
    }, "*");
  }

  function setFrameHeight(height) {
    window.parent.postMessage({
      type: "streamlit:setFrameHeight",
      height: height
    }, "*");
  }

  function blobToBase64(blob) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  startBtn.onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      preview.srcObject = stream;
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const base64DataUrl = await blobToBase64(blob);
        sendValueToStreamlit(base64DataUrl);
        status.innerText = "Sent to app ✅ — you can move on to the next step.";
        stream.getTracks().forEach((track) => track.stop());
      };

      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.innerText = "Recording... speak your answer, then click Stop.";
    } catch (err) {
      status.innerText = "Camera/mic access failed: " + err.message;
    }
  };

  stopBtn.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    startBtn.disabled = false;
    stopBtn.disabled = true;
  };

  window.addEventListener("load", () => {
    setFrameHeight(430);
    window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
  });
</script>
</body>
</html>
